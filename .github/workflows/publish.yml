name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validation.yml

  build:
    name: Build the release assets from the tag
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require an annotated tag matching pyproject.toml and committed release notes
        uses: wakamex/release-actions/verify-release-tag@stable
        with:
          version-command: >-
            sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml
      - name: Build the Linux archive and FFmpeg's source
        run: release/stage.sh release-assets
      - name: Keep the assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release-assets/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    uses: wakamex/release-actions/.github/workflows/binary-release.yml@stable
    with:
      artifact: release-assets
